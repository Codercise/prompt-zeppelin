- title: Sits right under your webcam
  text: The teleprompter floats at the top of your screen, above every other window and on every desktop, so your eyes stay level with the camera.

- title: A few words at a time
  text: The word you're on is bold and the next few are lined up beside it. Your eyes barely move, so nobody can tell you're reading.

- title: Read at your own pace
  text: Set the speed anywhere from 60 to 300 words per minute, and adjust it while the script is playing.

- title: Stays out of your way
  text: Clicks pass straight through to the app underneath. Hold Shift when you want to move or resize the teleprompter.

- title: Keep all your scripts
  text: Write and edit as many scripts as you like. They're saved on your Mac, not in someone else's cloud.

- title: Built for the Mac
  text: A small, native app written in Swift for macOS 14 Sonoma and later. Press Space to play or pause.
